name: Verify README visualization
on:
  push:
    paths:
      - 'scripts/generate_readme_animation.py'
      - 'assets/filament-workflow-concept.*'
      - '.github/workflows/readme-visualization.yml'
  pull_request:
    paths:
      - 'scripts/generate_readme_animation.py'
      - 'assets/filament-workflow-concept.*'
      - '.github/workflows/readme-visualization.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==10.4.0
      - run: python scripts/generate_readme_animation.py
      - name: Validate both formats and animation length
        run: |
          python -c "from PIL import Image; g=Image.open('assets/filament-workflow-concept.gif'); p=Image.open('assets/filament-workflow-concept.png'); assert g.n_frames == 18 and g.size == (720,216) and p.size == (720,216)"
